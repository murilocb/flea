<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="JetBrains Mono,JetBrainsMono Nerd Font,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#7982a9"/></pattern></defs><rect width="860" height="560" fill="#16161e"/><text x="24" y="35" font-size="11" fill="#565f89" font-weight="500" letter-spacing="1.54" font-variant-numeric="tabular-nums">FIELD BENCH, GUI GROUP, 2,000 FILES</text><text x="24" y="56" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">2,000 entries, 1,800 of them thumbnailable. Cold cache, one box, median of 3 runs per entrant, 2026-09-02. nautilus</text><text x="24" y="72" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">50.2.2-1, thunar 4.20.9-1, pcmanfm 1.4.0-2, nemo 6.6.4-1, dolphin 26.08.0-4, strata v0.6.1.</text><rect x="24.5" y="92.5" width="261.6666666666667" height="83" fill="#1f2335" stroke="#262b40" stroke-width="1"/><text x="38.0" y="126" font-size="24" fill="#c0caf5" font-variant-numeric="tabular-nums">36</text><text x="38.0" y="147" font-size="12" fill="#c0caf5" font-variant-numeric="tabular-nums">thumbnails Flea drew</text><text x="38.0" y="165" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">the viewport, by design</text><rect x="299.1666666666667" y="92.5" width="261.6666666666667" height="83" fill="#1f2335" stroke="#262b40" stroke-width="1"/><text x="312.6666666666667" y="126" font-size="24" fill="#c0caf5" font-variant-numeric="tabular-nums">552</text><text x="312.6666666666667" y="147" font-size="12" fill="#c0caf5" font-variant-numeric="tabular-nums">dolphin drew</text><text x="312.6666666666667" y="165" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">15.3x the work, about 5.6x the time</text><rect x="573.8333333333334" y="92.5" width="261.6666666666667" height="83" fill="#1f2335" stroke="#262b40" stroke-width="1"/><text x="587.3333333333334" y="126" font-size="24" fill="#c0caf5" font-variant-numeric="tabular-nums">1,800</text><text x="587.3333333333334" y="147" font-size="12" fill="#c0caf5" font-variant-numeric="tabular-nums">thumbnailable</text><text x="587.3333333333334" y="165" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">2,000 entries less 200 txt controls</text><rect x="24.5" y="196.5" width="811" height="272" fill="#1f2335" stroke="#262b40" stroke-width="1"/><text x="129" y="224" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">time to settled</text><text x="721" y="224" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">work done</text><text x="117" y="252" font-size="12" fill="#c0caf5" text-anchor="end" font-variant-numeric="tabular-nums">flea</text><rect x="129" y="242.5" width="43" height="11" fill="#9ece6a"/><text x="180" y="252" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">2,612 ms</text><text x="721" y="252" font-size="11" fill="#9ece6a" font-variant-numeric="tabular-nums">36 thumbs</text><text x="117" y="278" font-size="12" fill="#565f89" text-anchor="end" font-variant-numeric="tabular-nums">nemo</text><rect x="129" y="268.5" width="56" height="11" fill="#7982a9"/><text x="193" y="278" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">3,372 ms</text><text x="721" y="278" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">60 thumbs</text><text x="117" y="304" font-size="12" fill="#565f89" text-anchor="end" font-variant-numeric="tabular-nums">thunar</text><rect x="129" y="294.5" width="212" height="11" fill="#7982a9"/><text x="349" y="304" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">12,785 ms</text><text x="721" y="304" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">221 thumbs</text><text x="117" y="330" font-size="12" fill="#565f89" text-anchor="end" font-variant-numeric="tabular-nums">dolphin</text><rect x="129" y="320.5" width="241" height="11" fill="#7982a9"/><text x="378" y="330" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">14,514 ms</text><text x="721" y="330" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">552 thumbs</text><text x="117" y="356" font-size="12" fill="#565f89" text-anchor="end" font-variant-numeric="tabular-nums">nautilus</text><rect x="129" y="346.5" width="282" height="11" fill="#7982a9"/><text x="419" y="356" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">17,006 ms</text><text x="721" y="356" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">541 thumbs</text><text x="117" y="382" font-size="12" fill="#565f89" text-anchor="end" font-variant-numeric="tabular-nums">strata</text><rect x="129" y="372.5" width="511" height="11" fill="#7982a9"/><text x="648" y="382" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">30,792 ms</text><text x="721" y="382" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">205 thumbs</text><rect x="25" y="400" width="810" height="1" fill="#262b40"/><text x="43" y="419" font-size="11" fill="#f7768e" font-variant-numeric="tabular-nums">Not ranked. Work nobody measured cannot be compared on time, and an entrant that never settled has no time.</text><text x="117" y="443" font-size="12" fill="#565f89" text-anchor="end" font-variant-numeric="tabular-nums">pcmanfm</text><rect x="129" y="433.5" width="120" height="11" fill="url(#hatch)"/><text x="257" y="443" font-size="11" fill="#565f89" font-variant-numeric="tabular-nums">never settled</text><text x="721" y="443" font-size="11" fill="#f7768e" font-variant-numeric="tabular-nums">605 thumbs</text><text x="24" y="505" font-size="13" fill="#565f89" font-variant-numeric="tabular-nums">Every timing carries the work beside it. Flea settled in 2,612 ms drawing 36 thumbnails; dolphin settled</text><text x="24" y="523" font-size="13" fill="#565f89" font-variant-numeric="tabular-nums">in 14,514 ms drawing 552 thumbnails. Thumbnails are asked for only when the list stops moving and only</text><text x="24" y="541" font-size="13" fill="#565f89" font-variant-numeric="tabular-nums">for the rows on screen, so read each timing with the work column beside it.</text></svg>